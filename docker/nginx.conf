server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Autorise les uploads jusqu'à 10 Mo (photos de profil)
    client_max_body_size 10m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        resolver 127.0.0.11 valid=5s;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # Proxy WebSocket — nécessite les headers Upgrade pour Django Channels
    location /ws/ {
        resolver 127.0.0.11 valid=5s;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 86400;   # 24h — connexion persistante
    }

    # Proxy les fichiers media (photos uploadées) vers Django
    location /media/ {
        resolver 127.0.0.11 valid=5s;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
    }
}
