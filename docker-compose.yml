services:

  db:
    image: mysql:8
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE:      ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER:          ${DB_USER}
      MYSQL_PASSWORD:      ${DB_PASSWORD}
    # Port exposé uniquement en dev local (commenter en production)
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    # Port exposé uniquement en dev local (commenter en production)
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
    # Port exposé uniquement en dev local (commenter en production)
    # ports:
    #   - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - media_data:/app/media
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  media_data:
