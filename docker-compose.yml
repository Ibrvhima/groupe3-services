services:
  db:
    image: mysql:8
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: douraka_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: douraka
      MYSQL_PASSWORD: MySql@123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    # Volume pour persister les photos uploadées entre les redémarrages
    volumes:
      - media_data:/app/media
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  media_data:   # stockage persistant des photos uploadées
