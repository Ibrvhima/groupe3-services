services:
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: konakry_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: konakry
      MYSQL_PASSWORD: konakry
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mysql_data:
