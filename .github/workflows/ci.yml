  #      DOCKER_USERNAME   → votre identifiant DockerHub
  #      DOCKER_PASSWORD   → votre mot de passe DockerHub
  #      SERVER_HOST       → IP ou domaine du serveur (ex: 185.12.34.56)
  #      SERVER_USER       → utilisateur SSH (ex: ubuntu)
  #      SERVER_SSH_KEY    → clé SSH privée (contenu du fichier id_rsa)
