<!-- Conteneur avec data-attribute pour détecter les clics extérieurs -->
<div class="relative" data-notif-container>

  <!-- Bouton cloche avec badge non lues -->
  <button (click)="toggleDropdown()"
    class="relative p-2 rounded-xl hover:bg-gray-100 transition">
    <!-- Icône cloche -->
    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6 6 0 10-12 0v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
    </svg>
    <!-- Badge rouge avec le nombre de non lues -->
    <span *ngIf="notifService.nonLues() > 0"
      class="absolute -top-0.5 -right-0.5 w-4 h-4 bg-red-500 text-white text-[10px]
             font-bold rounded-full flex items-center justify-center">
      {{ notifService.nonLues() > 9 ? '9+' : notifService.nonLues() }}
    </span>
  </button>

  <!-- Dropdown des notifications -->
  <div *ngIf="ouvert"
    class="absolute right-0 top-full mt-2 w-80 bg-white rounded-2xl shadow-xl
           border border-gray-100 z-50 overflow-hidden">

    <!-- En-tête dropdown -->
    <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100">
      <span class="text-sm font-semibold text-gray-800">Notifications</span>
      <button *ngIf="notifService.nonLues() > 0"
        (click)="marquerToutLu()"
        class="text-xs text-orange-600 hover:underline">
        Tout marquer lu
      </button>
    </div>

    <!-- Liste des notifications -->
    <div class="max-h-80 overflow-y-auto divide-y divide-gray-50">

      <!-- État vide -->
      <p *ngIf="notifService.notifications().length === 0"
        class="text-sm text-gray-400 text-center py-8">
        Aucune notification
      </p>

      <!-- Chaque notification -->
      <div *ngFor="let n of notifService.notifications()"
        [class]="n.lu
          ? 'px-4 py-3 hover:bg-gray-50 transition'
          : 'px-4 py-3 bg-orange-50 hover:bg-orange-100 transition'">
        <p class="text-xs font-semibold text-gray-800">{{ n.titre }}</p>
        <p class="text-xs text-gray-500 mt-0.5">{{ n.message }}</p>
        <p class="text-[10px] text-gray-300 mt-1">
          {{ n.created_at | date:'d MMM, HH:mm' }}
        </p>
      </div>

    </div>
  </div>

</div>
