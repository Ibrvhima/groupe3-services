<div class="min-h-screen bg-gray-50">
  <app-prestataire-header></app-prestataire-header>

  <!-- Spinner initial -->
  <div *ngIf="loading" class="flex justify-center items-center py-32">
    <div class="w-8 h-8 border-4 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
  </div>

  <div *ngIf="!loading" class="max-w-lg mx-auto px-4 py-6">

    <!-- Titre -->
    <div class="flex items-center gap-3 mb-6">
      <button (click)="retour()" class="p-2 rounded-xl hover:bg-gray-200 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
      <div>
        <h1 class="text-lg font-bold text-gray-800">Mon profil</h1>
        <p class="text-xs text-gray-400">Mettez à jour vos informations professionnelles</p>
      </div>
    </div>

    <!-- Messages feedback -->
    <div *ngIf="success" class="text-xs text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-xl px-4 py-3 mb-4">
      {{ success }}
    </div>
    <div *ngIf="error" class="text-xs text-red-600 bg-red-50 border border-red-200 rounded-xl px-4 py-3 mb-4">
      {{ error }}
    </div>

    <!-- Section photo -->
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 mb-4">
      <p class="text-sm font-semibold text-gray-700 mb-4">Photo de profil</p>

      <div class="flex items-center gap-4">
        <!-- Avatar actuel ou prévisualisation -->
        <div class="w-20 h-20 rounded-2xl overflow-hidden bg-orange-100 flex-shrink-0 flex items-center justify-center">
          <img *ngIf="photoPreview || profil?.photo"
            [src]="photoPreview || (mediaUrl + profil?.photo)"
            alt="Photo de profil"
            class="w-full h-full object-cover"/>
          <!-- Initiales si pas de photo -->
          <span *ngIf="!photoPreview && !profil?.photo"
            class="text-2xl font-bold text-orange-600">
            {{ profil?.user?.nom?.charAt(0) }}{{ profil?.user?.prenom?.charAt(0) }}
          </span>
        </div>

        <!-- Bouton d'upload -->
        <div>
          <label class="cursor-pointer inline-flex items-center gap-2 text-sm font-medium
                         bg-orange-50 text-orange-600 px-4 py-2 rounded-xl hover:bg-orange-100 transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
            </svg>
            Choisir une photo
            <!-- Input caché, activé par le label -->
            <input type="file" accept="image/*" class="hidden" (change)="onPhotoChange($event)"/>
          </label>
          <p class="text-xs text-gray-400 mt-1">JPG, PNG — max 5 Mo</p>
        </div>
      </div>
    </div>

    <!-- Formulaire infos -->
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 space-y-4">
      <p class="text-sm font-semibold text-gray-700">Informations professionnelles</p>

      <!-- Catégorie -->
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Catégorie de service</label>
        <select [(ngModel)]="form.categorie_id"
          class="w-full text-sm border border-gray-200 rounded-xl px-3 py-2.5
                 focus:outline-none focus:ring-2 focus:ring-orange-400">
          <option [ngValue]="null">-- Sélectionner --</option>
          <option *ngFor="let c of categories" [ngValue]="c.id">{{ c.nom }}</option>
        </select>
      </div>

      <!-- Quartier -->
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Quartier</label>
        <input [(ngModel)]="form.quartier" type="text" placeholder="Ex : Kaloum, Matam..."
          class="w-full text-sm border border-gray-200 rounded-xl px-3 py-2.5
                 focus:outline-none focus:ring-2 focus:ring-orange-400"/>
      </div>

      <!-- Téléphone -->
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Téléphone professionnel</label>
        <input [(ngModel)]="form.telephone" type="tel" placeholder="Ex : 620 00 00 00"
          class="w-full text-sm border border-gray-200 rounded-xl px-3 py-2.5
                 focus:outline-none focus:ring-2 focus:ring-orange-400"/>
      </div>

      <!-- Description -->
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Description de vos services</label>
        <textarea [(ngModel)]="form.description" rows="4"
          placeholder="Décrivez votre expertise, vos années d'expérience..."
          class="w-full text-sm border border-gray-200 rounded-xl px-3 py-2.5
                 focus:outline-none focus:ring-2 focus:ring-orange-400 resize-none"></textarea>
      </div>

      <!-- Bouton sauvegarder -->
      <button (click)="sauvegarder()" [disabled]="saving"
        class="w-full bg-orange-600 text-white text-sm font-semibold py-3 rounded-xl
               hover:bg-orange-700 disabled:opacity-50 transition">
        {{ saving ? 'Enregistrement…' : 'Sauvegarder les modifications' }}
      </button>
    </div>

  </div>
</div>
