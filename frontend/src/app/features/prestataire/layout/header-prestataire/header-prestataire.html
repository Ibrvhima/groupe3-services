<header class="sticky top-0 z-50 backdrop-blur-xl bg-gray-950/90 border-b border-gray-800 shadow-lg">

  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">

    <!-- LOGO -->
    <a
      routerLink="/prestataire"
      class="flex items-center gap-3 group"
    >

      <!-- ICON -->
      <div
        class="w-11 h-11 rounded-2xl bg-gradient-to-br from-red-500 via-yellow-400 to-green-500 flex items-center justify-center shadow-lg shadow-black/30 group-hover:scale-105 transition duration-300"
      >

        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-5 h-5 text-white"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"
          />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"
          />
        </svg>

      </div>

      <!-- TITLE -->
      <div class="flex flex-col leading-tight">

        <span class="font-black text-lg tracking-wide">

          <span class="text-red-500">Konakry</span>
          <span class="text-yellow-400">Service</span>
          <span class="text-green-500">s</span>

        </span>

        <span class="text-[10px] uppercase tracking-[3px] text-gray-500">
          Prestataire
        </span>

      </div>

    </a>

    <!-- DESKTOP NAV -->
    <nav class="hidden md:flex items-center gap-2">

      <!-- DASHBOARD -->
      <a
        routerLink="/prestataire/dashboard"
        routerLinkActive="bg-blue-500/20 text-blue-400 border-blue-500/30"
        [routerLinkActiveOptions]="{ exact: true }"
        class="px-4 py-2 rounded-xl border border-transparent text-sm text-gray-300 hover:bg-gray-800 hover:text-white transition"
      >
        Dashboard
      </a>

      <!-- DEMANDES -->
      <a
        routerLink="/prestataire/demandes-recues"
        routerLinkActive="bg-blue-500/20 text-blue-400 border-blue-500/30"
        class="px-4 py-2 rounded-xl border border-transparent text-sm text-gray-300 hover:bg-gray-800 hover:text-white transition"
      >
        Demandes reçues
      </a>

    </nav>

    <!-- USER -->
    <div class="hidden md:flex items-center gap-3">

      <!-- USER CARD -->
      <div
        class="flex items-center gap-3 bg-gray-900 border border-gray-800 px-3 py-2 rounded-2xl"
      >

        <!-- AVATAR -->
        <div
          class="w-9 h-9 rounded-full bg-gradient-to-br from-blue-500 to-cyan-500 flex items-center justify-center text-sm font-bold text-white shadow-md"
        >
          {{ user?.nom?.charAt(0) }}{{ user?.prenom?.charAt(0) }}
        </div>

        <!-- INFOS -->
        <div class="leading-tight">

          <p class="text-sm font-medium text-white">
            {{ user?.nom }} {{ user?.prenom }}
          </p>

          <p class="text-xs text-gray-500">
            Prestataire
          </p>

        </div>

      </div>

      <!-- LOGOUT -->
      <button
        (click)="logout()"
        class="bg-red-500/10 hover:bg-red-500/20 border border-red-500/20 text-red-400 text-sm px-4 py-2 rounded-xl transition"
      >
        Déconnexion
      </button>

    </div>

    <!-- MOBILE BUTTON -->
    <button
      (click)="toggleMenu()"
      class="md:hidden w-10 h-10 rounded-xl bg-gray-900 border border-gray-800 flex items-center justify-center"
    >

      <!-- OPEN -->
      <svg
        *ngIf="!menuOpen"
        xmlns="http://www.w3.org/2000/svg"
        class="w-5 h-5 text-gray-300"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 6h16M4 12h16M4 18h16"
        />
      </svg>

      <!-- CLOSE -->
      <svg
        *ngIf="menuOpen"
        xmlns="http://www.w3.org/2000/svg"
        class="w-5 h-5 text-gray-300"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M6 18L18 6M6 6l12 12"
        />
      </svg>

    </button>

  </div>

  <!-- MOBILE MENU -->
  <div
    *ngIf="menuOpen"
    class="md:hidden border-t border-gray-800 bg-gray-950 px-4 py-4 space-y-3"
  >

    <!-- DASHBOARD -->
    <a
      routerLink="/prestataire"
      (click)="toggleMenu()"
      class="block bg-gray-900 hover:bg-gray-800 border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-300 transition"
    >
      Dashboard
    </a>

    <!-- DEMANDES -->
    <a
      routerLink="/prestataire/demandes"
      (click)="toggleMenu()"
      class="block bg-gray-900 hover:bg-gray-800 border border-gray-800 rounded-xl px-4 py-3 text-sm text-gray-300 transition"
    >
      Demandes reçues
    </a>

    <!-- USER -->
    <div
      class="border border-gray-800 bg-gray-900 rounded-2xl p-4 mt-4"
    >

      <div class="flex items-center gap-3 mb-4">

        <div
          class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-cyan-500 flex items-center justify-center text-sm font-bold text-white"
        >
          {{ user?.nom?.charAt(0) }}{{ user?.prenom?.charAt(0) }}
        </div>

        <div>

          <p class="text-sm text-white font-medium">
            {{ user?.nom }} {{ user?.prenom }}
          </p>

          <p class="text-xs text-gray-500">
            Prestataire
          </p>

        </div>

      </div>

      <button
        (click)="logout()"
        class="w-full bg-red-500/10 hover:bg-red-500/20 border border-red-500/20 text-red-400 py-3 rounded-xl text-sm transition"
      >
        Déconnexion
      </button>

    </div>

  </div>

</header>
