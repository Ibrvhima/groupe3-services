<header class="bg-white shadow-sm sticky top-0 z-50">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">

    <a routerLink="/admin" class="flex items-center gap-2">
      <div class="w-8 h-8 bg-gray-800 rounded-lg flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
        </svg>
      </div>
      <span class="font-bold text-gray-800 text-sm">DouraKa <span class="text-gray-500 font-normal">Admin</span></span>
    </a>

    <div class="hidden md:flex items-center gap-3">
      <span class="text-sm text-gray-600">{{ user?.nom }} {{ user?.prenom }}</span>
      <button (click)="logout()" class="text-xs bg-red-50 text-red-500 px-3 py-1.5 rounded-lg hover:bg-red-100 transition">
        Déconnexion
      </button>
    </div>

    <button (click)="toggleMenu()" class="md:hidden p-1">
      <svg *ngIf="!menuOpen" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
      <svg *ngIf="menuOpen" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <div *ngIf="menuOpen" class="md:hidden bg-white border-t border-gray-100 px-4 py-3">
    <div class="flex items-center justify-between py-2">
      <span class="text-sm text-gray-600">{{ user?.nom }} {{ user?.prenom }}</span>
      <button (click)="logout()" class="text-xs bg-red-50 text-red-500 px-3 py-1.5 rounded-lg">Déconnexion</button>
    </div>
  </div>
</header>
