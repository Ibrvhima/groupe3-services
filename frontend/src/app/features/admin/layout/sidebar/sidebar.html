<!-- Sidebar desktop -->
<aside class="hidden md:flex flex-col w-56 min-h-screen bg-gray-900 text-white fixed left-0 top-0 z-40">

  <!-- Logo -->
  <div class="px-4 py-4 border-b border-gray-700">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </div>
      <div>
        <p class="text-xs font-bold">DouraKa</p>
        <p class="text-xs text-gray-400">Administration</p>
      </div>
    </div>
  </div>

  <!-- Menu -->
  <nav class="flex-1 px-3 py-4 space-y-1">
    <a routerLink="/admin" routerLinkActive="bg-blue-600 text-white" [routerLinkActiveOptions]="{exact: true}"
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-gray-300 hover:bg-gray-800 transition">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
      </svg>
      Dashboard
    </a>
    <a routerLink="/admin/utilisateurs" routerLinkActive="bg-blue-600 text-white"
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-gray-300 hover:bg-gray-800 transition">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
      </svg>
      Utilisateurs
    </a>
    <a routerLink="/admin/prestataires" routerLinkActive="bg-blue-600 text-white"
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-gray-300 hover:bg-gray-800 transition">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
      </svg>
      Prestataires
    </a>
    <a routerLink="/admin/signalements" routerLinkActive="bg-blue-600 text-white"
      class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-gray-300 hover:bg-gray-800 transition">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 21v-4m0 0V5a2 2 0 012-2h6.5l1 1H21l-3 6 3 6h-8.5l-1-1H5a2 2 0 00-2 2zm9-13.5V9"/>
      </svg>
      Signalements
    </a>
  </nav>

  <!-- Profil + Déconnexion -->
  <div class="px-3 py-4 border-t border-gray-700">
    <div class="flex items-center gap-2 mb-3">
      <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center text-xs font-bold">
        {{ user?.nom?.charAt(0) }}{{ user?.prenom?.charAt(0) }}
      </div>
      <div class="min-w-0">
        <p class="text-xs font-medium truncate">{{ user?.nom }} {{ user?.prenom }}</p>
        <p class="text-xs text-gray-400">Administrateur</p>
      </div>
    </div>
    <button (click)="logout()"
      class="w-full flex items-center justify-center gap-2 bg-red-900 text-red-300 text-xs py-2 rounded-lg hover:bg-red-800 transition">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
      </svg>
      Déconnexion
    </button>
  </div>

</aside>

<!-- Header mobile admin -->
<header class="md:hidden bg-gray-900 text-white px-4 py-3 flex items-center justify-between sticky top-0 z-40">
  <div class="flex items-center gap-2">
    <div class="w-7 h-7 bg-blue-600 rounded-lg flex items-center justify-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
      </svg>
    </div>
    <span class="text-sm font-bold">Admin</span>
  </div>
  <button (click)="toggleMenu()" class="p-1">
    <svg *ngIf="!menuOpen" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
    <svg *ngIf="menuOpen" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
    </svg>
  </button>
</header>

<!-- Menu mobile -->
<div *ngIf="menuOpen" class="md:hidden bg-gray-900 text-white px-4 py-3 space-y-1 border-t border-gray-700">
  <a routerLink="/admin" (click)="toggleMenu()" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-gray-300 hover:bg-gray-800">Dashboard</a>
  <a routerLink="/admin/utilisateurs" (click)="toggleMenu()" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-gray-300 hover:bg-gray-800">Utilisateurs</a>
  <a routerLink="/admin/prestataires" (click)="toggleMenu()" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-gray-300 hover:bg-gray-800">Prestataires</a>
  <a routerLink="/admin/signalements" (click)="toggleMenu()" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-gray-300 hover:bg-gray-800">Signalements</a>
  <button (click)="logout()" class="w-full text-left px-3 py-2.5 text-sm text-red-400 hover:bg-gray-800 rounded-lg">Déconnexion</button>
</div>
