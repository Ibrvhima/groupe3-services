<header class="bg-white shadow-sm sticky top-0 z-50">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
    <!-- Logo -->
    <a routerLink="/client" class="flex items-center gap-2">
      <div class="w-8 h-8 bg-orange-600 rounded-lg flex items-center justify-center">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-4 h-4 text-white"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"
          />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"
          />
        </svg>
      </div>
      <span class="font-bold text-gray-800 text-sm">DouraKa</span>
    </a>

    <!-- Nav desktop -->
    <nav class="hidden md:flex items-center gap-6">
      <a routerLink="/client" routerLinkActive="text-orange-600 font-semibold"
        class="text-sm text-gray-600 hover:text-orange-600 transition">Accueil</a>
      <a routerLink="/client/mes-demandes" routerLinkActive="text-orange-600 font-semibold"
        class="text-sm text-gray-600 hover:text-orange-600 transition">Mes demandes</a>
      <a routerLink="/client/chat" routerLinkActive="text-orange-600 font-semibold"
        class="relative flex items-center gap-1.5 text-sm text-gray-600 hover:text-orange-600 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
        </svg>
        Messages
        <span *ngIf="chatService.nonLus() > 0"
          class="absolute -top-2 -right-3 bg-red-500 text-white text-xs font-bold rounded-full w-4 h-4 flex items-center justify-center leading-none">
          {{ chatService.nonLus() > 9 ? '9+' : chatService.nonLus() }}
        </span>
      </a>
    </nav>

    <!-- Notifications + Profil + Déconnexion desktop -->
    <div class="hidden md:flex items-center gap-3">
      <app-notifications></app-notifications>
      <span class="text-sm text-gray-600">{{ user?.nom }} {{ user?.prenom }}</span>
      <button
        (click)="logout()"
        class="text-xs bg-red-50 text-red-500 px-3 py-1.5 rounded-lg hover:bg-red-100 transition"
      >
        Déconnexion
      </button>
    </div>

    <!-- Actions rapides mobile + Hamburger -->
    <div class="flex md:hidden items-center gap-1">
      <!-- Icône Messages -->
      <a routerLink="/client/chat" class="relative p-2 text-gray-600 hover:text-orange-600 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
        </svg>
        <span *ngIf="chatService.nonLus() > 0"
          class="absolute top-0.5 right-0.5 bg-red-500 text-white text-xs font-bold rounded-full w-4 h-4 flex items-center justify-center leading-none">
          {{ chatService.nonLus() > 9 ? '9+' : chatService.nonLus() }}
        </span>
      </a>
      <!-- Icône Notifications -->
      <app-notifications></app-notifications>
      <!-- Hamburger -->
      <button (click)="toggleMenu()" class="p-2">
        <svg *ngIf="!menuOpen" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
        <svg *ngIf="menuOpen" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Menu mobile -->
  <div *ngIf="menuOpen" class="md:hidden bg-white border-t border-gray-100 px-4 py-3 space-y-3">
    <a routerLink="/client" (click)="toggleMenu()"
      class="block text-sm text-gray-700 py-2 border-b border-gray-50">Accueil</a>
    <a routerLink="/client/mes-demandes" (click)="toggleMenu()"
      class="block text-sm text-gray-700 py-2 border-b border-gray-50">Mes demandes</a>
    <a routerLink="/client/chat" (click)="toggleMenu()"
      class="flex items-center gap-1.5 text-sm text-gray-700 py-2 border-b border-gray-50">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
      </svg>
      Messages
    </a>
    <div class="flex items-center justify-between py-2">
      <span class="text-sm text-gray-600">{{ user?.nom }} {{ user?.prenom }}</span>
      <button (click)="logout()" class="text-xs bg-red-50 text-red-500 px-3 py-1.5 rounded-lg">
        Déconnexion
      </button>
    </div>
  </div>
</header>
