<div class="min-h-screen bg-gray-50">
  <app-header></app-header>

  <div class="max-w-lg mx-auto px-4 py-6">
    <!-- Retour -->
    <a
      [routerLink]="['/client/prestataire', prestataireUuid]"
      class="inline-flex items-center gap-1 text-xs text-gray-500 hover:text-blue-600 mb-4 transition"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-3.5 h-3.5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
      Retour
    </a>

    <!-- Infos prestataire -->
    <div *ngIf="prestataire" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-4">
      <div class="flex items-center gap-3">
        <div
          class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center flex-shrink-0"
        >
          <span class="text-blue-600 font-bold text-sm">
            {{ prestataire.user?.nom?.charAt(0) }}{{ prestataire.user?.prenom?.charAt(0) }}
          </span>
        </div>
        <div>
          <h3 class="text-sm font-semibold text-gray-800">
            {{ prestataire.user?.nom }} {{ prestataire.user?.prenom }}
          </h3>
          <p class="text-xs text-gray-500">
            {{ prestataire.categorie?.nom }} · {{ prestataire.quartier }}
          </p>
        </div>
      </div>
    </div>

    <!-- Formulaire -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
      <h2 class="text-lg font-bold text-gray-800 mb-4">Envoyer une demande</h2>

      <form (ngSubmit)="onSubmit()">
        <!-- Description -->
        <div class="mb-4">
          <label class="block text-xs font-medium text-gray-700 mb-1">
            Décrivez votre besoin <span class="text-red-500">*</span>
          </label>
          <textarea
            [(ngModel)]="description"
            name="description"
            rows="4"
            placeholder="Ex: J'ai une fuite d'eau dans ma cuisine, besoin d'une intervention urgente..."
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
          >
          </textarea>
        </div>

        <!-- Date intervention -->
        <div class="mb-5">
          <label class="block text-xs font-medium text-gray-700 mb-1">
            Date souhaitée <span class="text-gray-400">(optionnel)</span>
          </label>
          <input
            type="date"
            [(ngModel)]="date_intervention"
            name="date_intervention"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <!-- Erreur -->
        <div
          *ngIf="error"
          class="bg-red-50 border border-red-200 text-red-600 text-xs rounded-lg px-3 py-2 mb-3"
        >
          {{ error }}
        </div>

        <!-- Bouton -->
        <button
          type="submit"
          [disabled]="loading"
          class="w-full bg-blue-600 text-white py-2.5 rounded-xl font-semibold text-sm hover:bg-blue-700 active:scale-95 transition-all shadow-md disabled:opacity-50"
        >
          {{ loading ? 'Envoi...' : 'Envoyer la demande' }}
        </button>
      </form>
    </div>

    <!-- Modal Alert -->
    <app-modal-alert
      [isOpen]="modalOpen"
      [title]="modalTitle"
      [message]="modalMessage"
      [type]="modalType"
      [isConfirm]="modalIsConfirm"
      (confirmed)="onModalConfirm()"
      (cancelled)="onModalCancel()"
    ></app-modal-alert>
  </div>
</div>
