<div class="min-h-screen bg-gray-950 text-white">

  <!-- HEADER CLIENT -->
  <app-header-client></app-header-client>

  <div class="max-w-xl mx-auto px-4 py-6">

    <!-- RETOUR -->
    <button
      (click)="goBack()"
      class="flex items-center gap-2 text-sm text-gray-400 hover:text-white transition mb-6">

      <svg xmlns="http://www.w3.org/2000/svg"
           class="w-5 h-5"
           fill="none"
           viewBox="0 0 24 24"
           stroke="currentColor">

        <path stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 19l-7-7 7-7" />
      </svg>

      Retour

    </button>

    <!-- CARD -->
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5">

      <!-- TITLE -->
      <div class="mb-5">

        <h1 class="text-xl font-bold">
          Envoyer une demande
        </h1>

        <p class="text-sm text-gray-400 mt-1">
          Décris clairement ton besoin au prestataire
        </p>

      </div>

      <!-- ERROR -->
      <div
        *ngIf="error"
        class="bg-red-500/10 border border-red-500/20 text-red-400 p-3 rounded-xl mb-4 text-sm">

        {{ error }}

      </div>

      <!-- SUCCESS -->
      <div
        *ngIf="success"
        class="bg-green-500/10 border border-green-500/20 text-green-400 p-3 rounded-xl mb-4 text-sm">

        ✅ Demande envoyée avec succès

      </div>

      <!-- TEXTAREA -->
      <textarea
        [(ngModel)]="description"
        (input)="onInputChange()"
        rows="6"
        placeholder="Exemple : J’ai besoin d’un plombier pour réparer une fuite dans ma salle de bain..."
        class="w-full bg-gray-950 border border-gray-700 rounded-2xl p-4 text-sm text-white placeholder-gray-500 resize-none focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
      </textarea>

      <!-- INFOS -->
      <div class="flex items-center justify-between mt-2 mb-5">

        <span class="text-xs text-gray-500">
          Sois précis pour obtenir une meilleure réponse
        </span>

        <span class="text-xs text-gray-500">
          {{ description.length }}/500
        </span>

      </div>

      <!-- BUTTON -->
      <button
        (click)="onSubmit()"
        [disabled]="loading"
        class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-60 disabled:cursor-not-allowed py-3 rounded-2xl font-semibold transition-all duration-200">

        <!-- NORMAL -->
        <span
          *ngIf="!loading"
          class="flex items-center justify-center gap-2">

          Envoyer la demande

        </span>

        <!-- LOADING -->
        <span
          *ngIf="loading"
          class="flex items-center justify-center gap-3">

          <div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>

          Envoi en cours...

        </span>

      </button>

    </div>

  </div>

</div>
