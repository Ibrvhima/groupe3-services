<div class="min-h-screen bg-gradient-to-br from-blue-50 to-blue-100 flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-sm">

    <!-- Logo -->
    <div class="flex items-center justify-center gap-2 mb-8">
      <div class="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </div>
      <span class="font-extrabold text-gray-800 text-lg">KonakryServices</span>
    </div>

    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-7">

      <!-- Succès -->
      <div *ngIf="succes" class="text-center py-4">
        <div class="w-14 h-14 bg-emerald-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </svg>
        </div>
        <h2 class="text-base font-bold text-gray-800 mb-1">Mot de passe mis à jour !</h2>
        <p class="text-xs text-gray-400">Redirection vers la connexion…</p>
      </div>

      <!-- Formulaire -->
      <div *ngIf="!succes">
        <h1 class="text-lg font-bold text-gray-800 mb-1">Nouveau mot de passe</h1>
        <p class="text-xs text-gray-400 mb-6">Choisissez un mot de passe sécurisé (min. 6 caractères).</p>

        <!-- Message d'erreur -->
        <div *ngIf="error" class="text-xs text-red-600 bg-red-50 border border-red-200 rounded-xl px-3 py-2 mb-4">
          {{ error }}
        </div>

        <!-- Nouveau mot de passe -->
        <div class="mb-4">
          <label class="block text-xs font-medium text-gray-600 mb-1">Nouveau mot de passe</label>
          <input [(ngModel)]="password" type="password" placeholder="••••••••"
            class="w-full text-sm border border-gray-200 rounded-xl px-3 py-2.5
                   focus:outline-none focus:ring-2 focus:ring-blue-400"/>
        </div>

        <!-- Confirmation -->
        <div class="mb-6">
          <label class="block text-xs font-medium text-gray-600 mb-1">Confirmer le mot de passe</label>
          <input [(ngModel)]="confirm" type="password" placeholder="••••••••"
            class="w-full text-sm border border-gray-200 rounded-xl px-3 py-2.5
                   focus:outline-none focus:ring-2 focus:ring-blue-400"/>
        </div>

        <button (click)="soumettre()" [disabled]="loading"
          class="w-full bg-blue-600 text-white text-sm font-semibold py-3 rounded-xl
                 hover:bg-blue-700 disabled:opacity-50 transition">
          {{ loading ? 'Mise à jour…' : 'Confirmer le nouveau mot de passe' }}
        </button>
      </div>

    </div>

    <p class="text-center text-xs text-gray-400 mt-5">
      <a routerLink="/auth/login" class="text-blue-600 hover:underline font-medium">Retour à la connexion</a>
    </p>

  </div>
</div>
