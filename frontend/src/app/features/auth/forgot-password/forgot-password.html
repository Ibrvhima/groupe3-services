<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-sm">

    <!-- Logo -->
    <div class="flex items-center justify-center gap-2 mb-8">
      <div class="w-9 h-9 bg-orange-600 rounded-xl flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </div>
      <span class="font-extrabold text-gray-800 text-lg">DouraKa</span>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-7">

      <!-- Étape 1 : saisie de l'email -->
      <div *ngIf="!sent">
        <h1 class="text-lg font-bold text-gray-800 mb-1">Mot de passe oublié</h1>
        <p class="text-xs text-gray-400 mb-6">
          Entrez votre email pour recevoir un lien de réinitialisation.
        </p>

        <div *ngIf="error" class="text-xs text-red-600 bg-red-50 border border-red-200 rounded-xl px-3 py-2 mb-4">
          {{ error }}
        </div>

        <div class="mb-4">
          <label class="block text-xs font-medium text-gray-600 mb-1">Adresse email</label>
          <input [(ngModel)]="email" type="email" placeholder="vous@exemple.com"
            class="w-full text-sm border border-gray-200 rounded-xl px-3 py-2.5
                   focus:outline-none focus:ring-2 focus:ring-orange-400"/>
        </div>

        <button (click)="soumettre()" [disabled]="loading"
          class="w-full bg-orange-600 text-white text-sm font-semibold py-3 rounded-xl
                 hover:bg-orange-700 disabled:opacity-50 transition">
          {{ loading ? 'Envoi en cours…' : 'Envoyer le lien' }}
        </button>
      </div>

      <!-- Étape 2 : confirmation d'envoi -->
      <div *ngIf="sent" class="text-center">
        <div class="w-14 h-14 bg-emerald-100 rounded-xl flex items-center justify-center mx-auto mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
        </div>
        <h2 class="text-base font-bold text-gray-800 mb-2">Vérifiez votre email</h2>
        <p class="text-xs text-gray-500 leading-relaxed mb-6">
          Si <span class="font-medium text-gray-700">{{ email }}</span> est enregistré,
          vous recevrez un lien de réinitialisation dans quelques instants.
          <br/><br/>
          Pensez à vérifier vos spams.
        </p>
        <button (click)="sent = false; email = ''"
          class="w-full border border-gray-200 text-gray-600 text-sm font-medium py-2.5
                 rounded-xl hover:bg-gray-50 transition">
          Utiliser un autre email
        </button>
      </div>

    </div>

    <!-- Retour connexion -->
    <p class="text-center text-xs text-gray-400 mt-5">
      <a routerLink="/auth/login" class="text-orange-600 hover:underline font-medium">Retour à la connexion</a>
    </p>

  </div>
</div>
