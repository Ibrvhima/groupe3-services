<div class="min-h-screen bg-gradient-to-br from-blue-50 to-blue-100 flex flex-col justify-center px-4 py-6">

  <!-- Logo -->
  <div class="text-center mb-4">
    <div class="inline-flex items-center justify-center w-12 h-12 bg-blue-600 rounded-xl mb-2 shadow-lg">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
    </div>
    <h1 class="text-xl font-bold text-blue-700">DouraKa</h1>
    <p class="text-gray-500 text-xs mt-1">Trouvez un prestataire près de chez vous</p>
  </div>

  <!-- Carte -->
  <div class="bg-white rounded-2xl shadow-lg p-5 w-full max-w-md mx-auto">
    <h2 class="text-lg font-bold text-gray-800 mb-4">Connexion</h2>

    <form (ngSubmit)="onSubmit()">

      <!-- Email -->
      <div class="mb-3">
        <label class="block text-xs font-medium text-gray-700 mb-1">Email</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-3 flex items-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
            </svg>
          </span>
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="exemple@gmail.com"
            class="w-full border border-gray-300 rounded-lg pl-9 pr-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
      </div>

      <!-- Mot de passe -->
      <div class="mb-3">
        <label class="block text-xs font-medium text-gray-700 mb-1">Mot de passe</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-3 flex items-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
          </span>
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            placeholder="••••••••"
            class="w-full border border-gray-300 rounded-lg pl-9 pr-10 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
          <button type="button" (click)="togglePassword()" class="absolute inset-y-0 right-3 flex items-center">
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Se souvenir de moi -->
      <div class="flex items-center justify-between mb-4">
        <label class="flex items-center gap-2 text-xs text-gray-600 cursor-pointer">
          <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" class="w-3.5 h-3.5 text-blue-600 rounded" />
          Se souvenir de moi
        </label>
        <a routerLink="/auth/forgot-password" class="text-xs text-blue-600 hover:underline">Mot de passe oublié ?</a>
      </div>

      <!-- Erreur -->
      <div *ngIf="error" class="bg-red-50 border border-red-200 text-red-600 text-xs rounded-lg px-3 py-2 mb-3">
        {{ error }}
      </div>

      <!-- Bouton -->
     <button
  type="submit"
  [disabled]="loading"
  class="w-full bg-amber-500 text-white py-2.5 rounded-xl font-semibold text-sm hover:bg-amber-600 active:scale-95 transition-all shadow-md disabled:opacity-50">
  {{ loading ? 'Connexion...' : 'Se connecter' }}
</button>

    </form>

    <!-- Lien register -->
    <p class="text-center text-xs text-gray-500 mt-4">
      Pas encore inscrit ?
      <a routerLink="/auth/register" class="text-blue-600 font-semibold">Créer un compte</a>
    </p>

  </div>

  <p class="text-center text-xs text-gray-400 mt-4">© 2026 KonakryServices — Conakry, Guinée</p>

</div>
