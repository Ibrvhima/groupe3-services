<style>
.input-dark {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  background: rgba(255,255,255,0.1);
  color: white;
  border: 1px solid rgba(255,255,255,0.2);
  outline: none;
}

.btn-active {
  background: #2563eb;
  color: white;
  border-radius: 10px;
  padding: 8px;
}

.btn-inactive {
  background: rgba(255,255,255,0.1);
  color: #ccc;
  border-radius: 10px;
  padding: 8px;
}
</style>


<div class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 flex items-center justify-center px-4">

  <!-- Container -->
  <div class="w-full max-w-md">

    <!-- Logo -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-blue-600 rounded-2xl shadow-lg mb-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-white">KonakryServices</h1>
      <p class="text-gray-300 text-sm">Connectez-vous à votre compte</p>
    </div>

    <!-- Card -->
    <div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl shadow-xl p-6">

      <form (ngSubmit)="onSubmit()">

        <!-- Email -->
        <div class="mb-4">
          <label class="text-xs text-gray-300 mb-1 block">Email</label>
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="exemple@gmail.com"
            class="w-full px-4 py-2 rounded-lg bg-white/20 text-white placeholder-gray-300 border border-white/20 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <!-- Password -->
        <div class="mb-4">
          <label class="text-xs text-gray-300 mb-1 block">Mot de passe</label>
          <div class="relative">
            <input
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="password"
              name="password"
              placeholder="••••••••"
              class="w-full px-4 py-2 rounded-lg bg-white/20 text-white placeholder-gray-300 border border-white/20 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
            <button
              type="button"
              (click)="togglePassword()"
              class="absolute right-3 top-2 text-gray-300 text-xs"
            >
              {{ showPassword ? 'Masquer' : 'Voir' }}
            </button>
          </div>
        </div>

        <!-- Options -->
        <div class="flex justify-between items-center mb-4 text-xs text-gray-300">
          <label class="flex items-center gap-2">
            <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" />
            Se souvenir
          </label>
          <span class="hover:underline cursor-pointer">Mot de passe oublié ?</span>
        </div>

        <!-- Error -->
        <div *ngIf="error"
          class="bg-red-500/20 border border-red-400 text-red-300 text-xs px-3 py-2 rounded-lg mb-3 animate-pulse">
          {{ error }}
        </div>

        <!-- Button -->
        <button
          type="submit"
          [disabled]="loading"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-xl font-semibold transition-all shadow-lg disabled:opacity-50 flex justify-center items-center gap-2"
        >
          <span *ngIf="!loading">Se connecter</span>

          <!-- Loader -->
          <svg *ngIf="loading" class="animate-spin h-4 w-4" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" stroke="white" stroke-width="4" fill="none" />
          </svg>
        </button>

      </form>

      <!-- Register link -->
      <p class="text-center text-xs text-gray-300 mt-5">
        Pas encore inscrit ?
        <a routerLink="/auth/register" class="text-blue-400 font-semibold hover:underline">
          Créer un compte
        </a>
      </p>

    </div>

    <!-- Footer -->
    <p class="text-center text-gray-400 text-xs mt-5">
      © 2026 KonakryServices — Conakry, Guinée
    </p>

  </div>
</div>
