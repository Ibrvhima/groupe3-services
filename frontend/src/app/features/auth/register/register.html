<div class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 flex items-center justify-center px-4">

  <div class="w-full max-w-lg">

    <!-- Logo -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-blue-600 rounded-2xl shadow-lg mb-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-white">KonakryServices</h1>
      <p class="text-gray-300 text-sm">Créer un compte</p>
    </div>

    <!-- Card -->
    <div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl shadow-xl p-6 space-y-4">

      <form (ngSubmit)="onSubmit()" class="space-y-4">

        <!-- Nom + prénom -->
        <div class="grid grid-cols-2 gap-3">
          <input [(ngModel)]="nom" name="nom" placeholder="Nom"
            class="w-full px-3 py-2 rounded-lg bg-white/10 border border-white/20 text-white placeholder-gray-300 focus:ring-2 focus:ring-blue-500 outline-none"/>
          
          <input [(ngModel)]="prenom" name="prenom" placeholder="Prénom"
            class="w-full px-3 py-2 rounded-lg bg-white/10 border border-white/20 text-white placeholder-gray-300 focus:ring-2 focus:ring-blue-500 outline-none"/>
        </div>

        <!-- Email -->
        <input [(ngModel)]="email" name="email" placeholder="Email"
          class="w-full px-3 py-2 rounded-lg bg-white/10 border border-white/20 text-white placeholder-gray-300 focus:ring-2 focus:ring-blue-500 outline-none"/>

        <!-- Téléphone -->
        <input [(ngModel)]="telephone" name="telephone" placeholder="Téléphone"
          class="w-full px-3 py-2 rounded-lg bg-white/10 border border-white/20 text-white placeholder-gray-300 focus:ring-2 focus:ring-blue-500 outline-none"/>

        <!-- Role -->
        <div class="grid grid-cols-2 gap-3">
          <button type="button"
            (click)="role='client'"
            [ngClass]="role==='client' 
              ? 'bg-blue-600 text-white' 
              : 'bg-white/10 text-gray-300'"
            class="py-2 rounded-lg font-semibold transition">
            Client
          </button>

          <button type="button"
            (click)="role='prestataire'"
            [ngClass]="role==='prestataire' 
              ? 'bg-blue-600 text-white' 
              : 'bg-white/10 text-gray-300'"
            class="py-2 rounded-lg font-semibold transition">
            Prestataire
          </button>
        </div>

        <!-- Champs prestataire -->
        <div *ngIf="role==='prestataire'" class="space-y-3">

          <select
  [(ngModel)]="categorie_id"
  name="categorie_id"
  class="w-full px-3 py-2 rounded-lg bg-white/10 border border-white/20 text-white focus:ring-2 focus:ring-blue-500 outline-none">

  <option value="" class="text-gray-400">Choisir un métier</option>

  <option
    *ngFor="let cat of categories"
    [value]="cat.id"
    class="text-black bg-white">
    {{ cat.nom }}
  </option>

</select>

          <input [(ngModel)]="quartier" name="quartier" placeholder="Quartier"
            class="w-full px-3 py-2 rounded-lg bg-white/10 border border-white/20 text-white focus:ring-2 focus:ring-blue-500 outline-none"/>

          <textarea [(ngModel)]="description" name="description" placeholder="Description"
            class="w-full px-3 py-2 rounded-lg bg-white/10 border border-white/20 text-white focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
     </div>

        <!-- Password -->
        <div class="relative">
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            placeholder="Mot de passe"
            class="w-full px-3 py-2 rounded-lg bg-white/10 border border-white/20 text-white pr-10 focus:ring-2 focus:ring-blue-500 outline-none"/>

          <button type="button"
            (click)="togglePassword()"
            class="absolute right-3 top-2 text-gray-300 text-sm">
            👁
          </button>
        </div>

        <!-- Error -->
        <div *ngIf="error"
          class="bg-red-500/20 border border-red-400 text-red-300 text-xs px-3 py-2 rounded-lg">
          {{ error }}
        </div>

        <!-- Submit -->
        <button type="submit"
          [disabled]="loading"
          class="w-full bg-blue-600 hover:bg-blue-700 py-2.5 rounded-xl text-white font-semibold transition disabled:opacity-50">
          {{ loading ? 'Création...' : 'Créer un compte' }}
        </button>

      </form>

      <!-- Footer -->
      <p class="text-center text-xs text-gray-300">
        Déjà inscrit ?
        <a routerLink="/auth/login" class="text-blue-400 font-semibold">Se connecter</a>
      </p>

    </div>

  </div>
</div>
