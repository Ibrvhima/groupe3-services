<div class="min-h-screen bg-gradient-to-br from-blue-50 to-blue-100 flex flex-col justify-center px-4 py-6">

  <!-- Logo -->
  <div class="text-center mb-4">
    <div class="inline-flex items-center justify-center w-12 h-12 bg-blue-600 rounded-xl mb-2 shadow-lg">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
    </div>
    <h1 class="text-xl font-bold text-blue-700">KonakryServices</h1>
    <p class="text-gray-500 text-xs mt-1">Créez votre compte gratuitement</p>
  </div>

  <!-- Carte -->
  <div class="bg-white rounded-2xl shadow-lg p-5 w-full max-w-md mx-auto">
    <h2 class="text-lg font-bold text-gray-800 mb-4">Inscription</h2>

    <form (ngSubmit)="onSubmit()">

      <!-- Nom & Prénom -->
      <div class="grid grid-cols-2 gap-2 mb-3">
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">Nom</label>
          <input type="text" [(ngModel)]="nom" name="nom" placeholder="Diallo"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">Prénom</label>
          <input type="text" [(ngModel)]="prenom" name="prenom" placeholder="Ibrahima"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
      </div>

      <!-- Email -->
      <div class="mb-3">
        <label class="block text-xs font-medium text-gray-700 mb-1">Email</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-3 flex items-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
            </svg>
          </span>
          <input type="email" [(ngModel)]="email" name="email" placeholder="exemple@gmail.com"
            class="w-full border border-gray-300 rounded-lg pl-9 pr-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
      </div>

      <!-- Téléphone -->
      <div class="mb-3">
        <label class="block text-xs font-medium text-gray-700 mb-1">Téléphone</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-3 flex items-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
            </svg>
          </span>
          <input type="tel" [(ngModel)]="telephone" name="telephone" placeholder="622 000 000"
            class="w-full border border-gray-300 rounded-lg pl-9 pr-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
      </div>

      <!-- Rôle -->
      <div class="mb-3">
        <label class="block text-xs font-medium text-gray-700 mb-2">Je suis</label>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" (click)="role = 'client'"
            [class]="role === 'client'
              ? 'border-2 border-blue-600 bg-blue-50 text-blue-700 rounded-xl py-2 text-xs font-semibold flex flex-col items-center gap-1'
              : 'border-2 border-gray-200 text-gray-500 rounded-xl py-2 text-xs font-semibold flex flex-col items-center gap-1'">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            Client
          </button>
          <button type="button" (click)="role = 'prestataire'"
            [class]="role === 'prestataire'
              ? 'border-2 border-blue-600 bg-blue-50 text-blue-700 rounded-xl py-2 text-xs font-semibold flex flex-col items-center gap-1'
              : 'border-2 border-gray-200 text-gray-500 rounded-xl py-2 text-xs font-semibold flex flex-col items-center gap-1'">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
            Prestataire
          </button>
        </div>
      </div>

      <!-- Champs supplémentaires prestataire -->
      <div *ngIf="role === 'prestataire'" class="border-t border-gray-100 pt-3 mb-3">
        <p class="text-xs font-semibold text-blue-600 mb-3">Informations professionnelles</p>

        <!-- Catégorie -->
        <div class="mb-3">
          <label class="block text-xs font-medium text-gray-700 mb-1">Métier</label>
          <select [(ngModel)]="categorie_id" name="categorie_id"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">Choisir un métier</option>
            <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.nom }}</option>
          </select>
        </div>

        <!-- Quartier -->
        <div class="mb-3">
          <label class="block text-xs font-medium text-gray-700 mb-1">Quartier</label>
          <input type="text" [(ngModel)]="quartier" name="quartier" placeholder="Ex: Kaloum, Ratoma..."
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <!-- Description -->
        <div class="mb-3">
          <label class="block text-xs font-medium text-gray-700 mb-1">Description</label>
          <textarea [(ngModel)]="description" name="description" rows="2"
            placeholder="Décrivez votre expérience et vos services..."
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
        </div>
      </div>

      <!-- Mot de passe -->
      <div class="mb-4">
        <label class="block text-xs font-medium text-gray-700 mb-1">Mot de passe</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-3 flex items-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
          </span>
          <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password"
            placeholder="Minimum 8 caractères"
            class="w-full border border-gray-300 rounded-lg pl-9 pr-10 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
          <button type="button" (click)="togglePassword()" class="absolute inset-y-0 right-3 flex items-center">
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Erreur -->
      <div *ngIf="error" class="bg-red-50 border border-red-200 text-red-600 text-xs rounded-lg px-3 py-2 mb-3">
        {{ error }}
      </div>

      <!-- Bouton -->
      <button type="submit" [disabled]="loading"
        class="w-full bg-blue-600 text-white py-2.5 rounded-xl font-semibold text-sm hover:bg-blue-700 active:scale-95 transition-all shadow-md disabled:opacity-50">
        {{ loading ? 'Création...' : 'Créer mon compte' }}
      </button>

    </form>

    <p class="text-center text-xs text-gray-500 mt-4">
      Déjà inscrit ?
      <a routerLink="/auth/login" class="text-blue-600 font-semibold">Se connecter</a>
    </p>
  </div>

  <p class="text-center text-xs text-gray-400 mt-4">© 2026 KonakryServices — Conakry, Guinée</p>

</div>
